<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="description"
        content="AI VPS Management Dashboard"
    >

    <title>
        {% block title %}
        AI VPS Management
        {% endblock %}
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/static/css/app.css"
    >
</head>

<body>
<div
    id="sidebar-overlay"
    class="sidebar-overlay"
></div>

<div class="app-layout">
    <aside
        id="sidebar"
        class="sidebar"
    >
        <div class="sidebar-header">
            <a
                href="/"
                class="brand"
            >
                <span class="brand-icon">
                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path
                            d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v3A2.5 2.5 0 0 1 17.5 11h-11A2.5 2.5 0 0 1 4 8.5v-3Zm0 10A2.5 2.5 0 0 1 6.5 13h11a2.5 2.5 0 0 1 2.5 2.5v3a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 18.5v-3Z"
                        />
                        <path
                            d="M7.5 7h.01M7.5 17h.01M11 7h6M11 17h6"
                        />
                    </svg>
                </span>

                <span class="brand-text">
                    <strong>VPS Agent</strong>
                    <small>AI Infrastructure</small>
                </span>
            </a>

            <button
                id="sidebar-close"
                class="icon-button sidebar-close"
                type="button"
                aria-label="إغلاق القائمة"
            >
                <svg viewBox="0 0 24 24">
                    <path d="m6 6 12 12M18 6 6 18"/>
                </svg>
            </button>
        </div>

        <nav class="sidebar-navigation">
            <span class="navigation-label">
                الإدارة
            </span>

            <a
                href="/"
                class="navigation-link"
                data-route="/"
            >
                <svg viewBox="0 0 24 24">
                    <path d="M4 13h6V4H4v9Zm0 7h6v-4H4v4Zm10 0h6v-9h-6v9Zm0-16v4h6V4h-6Z"/>
                </svg>

                <span>لوحة التحكم</span>
            </a>
            <a
    href="/monitoring-profiles"
    class="navigation-link"
    data-route="/monitoring-profiles"
>
    <svg viewBox="0 0 24 24">
        <path d="M4 6h16M4 12h16M4 18h16"/>
        <circle cx="8" cy="6" r="1.5"/>
        <circle cx="16" cy="12" r="1.5"/>
        <circle cx="10" cy="18" r="1.5"/>
    </svg>

    <span>ملفات المراقبة</span>
</a>

            <a
                href="/servers"
                class="navigation-link"
                data-route="/servers"
            >
                <svg viewBox="0 0 24 24">
                    <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v3A2.5 2.5 0 0 1 17.5 11h-11A2.5 2.5 0 0 1 4 8.5v-3Zm0 10A2.5 2.5 0 0 1 6.5 13h11a2.5 2.5 0 0 1 2.5 2.5v3a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 18.5v-3Z"/>
                    <path d="M7.5 7h.01M7.5 17h.01M11 7h6M11 17h6"/>
                </svg>

                <span>السيرفرات</span>
            </a>

            <a
                href="/commands"
                class="navigation-link"
                data-route="/commands"
            >
                <svg viewBox="0 0 24 24">
                    <path d="m5 7 4 4-4 4M11 17h8"/>
                </svg>

                <span>أوامر المراقبة</span>
            </a>

            <a
                href="/reports"
                class="navigation-link"
                data-route="/reports"
            >
                <svg viewBox="0 0 24 24">
                    <path d="M4 19V5a2 2 0 0 1 2-2h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/>
                    <path d="M14 3v6h6M8 13h8M8 17h5"/>
                </svg>

                <span>التقارير</span>
            </a>

            <span class="navigation-label">
                النظام
            </span>

            <a
                href="/docs"
                class="navigation-link"
                target="_blank"
            >
                <svg viewBox="0 0 24 24">
                    <path d="M4 5a2 2 0 0 1 2-2h5v18H6a2 2 0 0 1-2-2V5Zm16 0a2 2 0 0 0-2-2h-5v18h5a2 2 0 0 0 2-2V5Z"/>
                </svg>

                <span>توثيق API</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="agent-status">
                <span class="status-indicator"></span>

                <div>
                    <strong>الوكيل يعمل</strong>
                    <small>Monitoring Active</small>
                </div>
            </div>
        </div>
    </aside>

    <div class="main-wrapper">
        <header class="topbar">
            <div class="topbar-start">
                <button
                    id="sidebar-open"
                    class="icon-button mobile-menu-button"
                    type="button"
                    aria-label="فتح القائمة"
                >
                    <svg viewBox="0 0 24 24">
                        <path d="M4 7h16M4 12h16M4 17h16"/>
                    </svg>
                </button>

                <div class="page-context">
                    <span class="page-context-label">
                        إدارة البنية التحتية
                    </span>

                    <strong id="current-page-title">
                        لوحة التحكم
                    </strong>
                </div>
            </div>

            <div class="topbar-actions">
                <button
                    id="refresh-page"
                    class="icon-button"
                    type="button"
                    title="تحديث الصفحة"
                >
                    <svg viewBox="0 0 24 24">
                        <path d="M20 11a8 8 0 1 0-2.34 5.66"/>
                        <path d="M20 4v7h-7"/>
                    </svg>
                </button>

                <button
                    id="theme-toggle"
                    class="icon-button"
                    type="button"
                    title="تغيير المظهر"
                >
                    <svg
                        class="theme-light-icon"
                        viewBox="0 0 24 24"
                    >
                        <path d="M12 3V1M12 23v-2M4.22 4.22 2.8 2.8M21.2 21.2l-1.42-1.42M3 12H1M23 12h-2M4.22 19.78 2.8 21.2M21.2 2.8l-1.42 1.42"/>
                        <circle cx="12" cy="12" r="4"/>
                    </svg>

                    <svg
                        class="theme-dark-icon"
                        viewBox="0 0 24 24"
                    >
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>
                    </svg>
                </button>

                <div class="profile-button">
                    <span class="profile-avatar">
                        SK
                    </span>

                    <div class="profile-details">
                        <strong>Administrator</strong>
                        <small>System Owner</small>
                    </div>
                </div>
            </div>
        </header>

        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
</div>

<div
    id="toast-container"
    class="toast-container"
></div>

<script src="/static/js/app.js"></script>

{% block scripts %}{% endblock %}
</body>
</html>
