{% extends "base.html" %}
{% block title %}Autonomous Reservations{% endblock %}
{% block content %}<header class="page-header"><div><h1 class="page-heading">Autonomous Reservations</h1><p class="page-description">Read-only idempotency and recovery state. Owner tokens are never displayed.</p></div></header><section class="panel"><header class="panel-header"><h2 class="panel-title">Reservations</h2><button id="reservation-reload" class="button button-secondary button-sm" type="button">Refresh</button></header><div id="reservation-list" class="panel-body"><div class="empty-state"><h3>Loading reservations...</h3></div></div></section>{% endblock %}
{% block scripts %}<script src="/static/js/autonomous.js"></script><script>
(() => { const node = document.getElementById("reservation-list"); function render(items) { if (!items.length) return AutonomousUI.showEmpty(node, "No autonomous reservations recorded."); node.innerHTML = `<div class="admin-table-wrap"><table class="data-table"><thead><tr><th>Reservation</th><th>Status</th><th>Policy / Plan</th><th>Fingerprint</th><th>Server</th><th>Action / Target</th><th>Authorization</th><th>Execution</th><th>Created</th></tr></thead><tbody>${items.map(item => `<tr><td><code>${escapeHtml(item.reservation_id)}</code><br><small>${escapeHtml(item.idempotency_key)}</small></td><td>${AutonomousUI.badge(item.status)}</td><td>${escapeHtml(item.policy_id)}<br>${escapeHtml(item.plan_id)}</td><td><code class="admin-code">${escapeHtml(item.plan_fingerprint)}</code></td><td>${escapeHtml(item.server_id)}</td><td>${escapeHtml(item.action_type)}<br>${escapeHtml(item.target)}</td><td>${escapeHtml(AutonomousUI.text(item.authorization_id))}</td><td>${escapeHtml(AutonomousUI.text(item.execution_id))}</td><td>${AutonomousUI.date(item.created_at)}</td></tr>`).join("")}</tbody></table></div>`; } async function load() { try { render(await apiRequest("/api/autonomous-remediation/executions?limit=500")); } catch (error) { AutonomousUI.showError(node, error); } } document.getElementById("reservation-reload").addEventListener("click", load); load(); })();
</script>{% endblock %}
