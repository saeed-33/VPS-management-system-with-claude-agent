{% extends "base.html" %}
{% block title %}Policy Candidates{% endblock %}
{% block content %}
<header class="page-header"><div><h1 class="page-heading">Policy Candidates</h1><p class="page-description">Advisory history-derived candidates. A candidate is never an enabled policy.</p></div></header>
<section class="panel"><header class="panel-header"><h2 class="panel-title">Candidates</h2><button id="candidate-reload" class="button button-secondary button-sm" type="button">Refresh</button></header><div id="candidate-list" class="panel-body"><div class="empty-state"><h3>Loading candidates...</h3></div></div></section>
{% endblock %}
{% block scripts %}<script src="/static/js/autonomous.js"></script><script>
(() => { const node = document.getElementById("candidate-list");
function render(items) { if (!items.length) return AutonomousUI.showEmpty(node, "No policy candidates currently available."); node.innerHTML = items.map(item => `<article class="panel" style="margin-bottom:1rem"><header class="panel-header"><div><h3 class="panel-title"><code>${escapeHtml(item.issue_fingerprint)}</code></h3><p class="panel-subtitle">${escapeHtml(item.action_type)} → ${escapeHtml(item.target)}</p></div><div>${AutonomousUI.badge(item.reason_codes && item.reason_codes.includes("eligible_for_policy_review") ? "eligible" : "review")}</div></header><div class="panel-body"><div class="admin-kv-grid"><div class="admin-kv"><strong>Execution count</strong><span>${AutonomousUI.number(item.execution_count, 0)}</span></div><div class="admin-kv"><strong>Verified successes</strong><span>${AutonomousUI.number(item.verified_success_count, 0)}</span></div><div class="admin-kv"><strong>Failures</strong><span>${AutonomousUI.number(item.failure_count, 0)}</span></div><div class="admin-kv"><strong>Rollback failures</strong><span>${AutonomousUI.number(item.rollback_failure_count, 0)}</span></div><div class="admin-kv"><strong>Success rate</strong><span>${AutonomousUI.percent(item.success_rate)}</span></div><div class="admin-kv"><strong>Reason codes</strong><span>${escapeHtml((item.reason_codes || []).join(", ") || "—")}</span></div></div><div class="form-actions" data-required-permission="autonomous.policy.create"><a class="button button-secondary button-sm" href="/autonomous-policies?fingerprint=${encodeURIComponent(item.issue_fingerprint)}&action=${encodeURIComponent(item.action_type)}&target=${encodeURIComponent(item.target)}">Create disabled policy draft</a></div></div></article>`).join(""); applyPermissionVisibility(); }
async function load() { try { render(await apiRequest("/api/autonomous-remediation/candidates")); } catch (error) { AutonomousUI.showError(node, error); } }
document.getElementById("candidate-reload").addEventListener("click", load); load(); })();
</script>{% endblock %}
