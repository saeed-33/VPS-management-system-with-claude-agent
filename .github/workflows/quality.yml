name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Tests and architecture checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q app tests tools

      - name: Audit source structure
        run: python tools/dev/structure_audit.py --root app --strict

      - name: Verify generated project structure
        shell: bash
        run: |
          python tools/dev/generate_project_structure.py
          git diff --exit-code -- docs/PROJECT_STRUCTURE.md

      - name: Run architecture and unit tests
        run: python -m pytest -q --disable-warnings
